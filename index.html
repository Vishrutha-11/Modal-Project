<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>Modal window</title>
  </head>
  <body>
    <button
      type="button"
      class="show-modal"
      aria-haspopup="dialog"
      aria-controls="modal-window"
      data-text="This is paragraph for Modal 1
     Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod
        tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim
        veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea
        commodo consequat."
    >
      Show modal 1
    </button>
    <button
      type="button"
      class="show-modal"
      aria-haspopup="dialog"
      aria-controls="modal-window"
      data-text="This is paragraph for Modal 2
    Duis aute irure dolor in reprehenderit in voluptate
        velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint
        occaecat cupidatat non proident, sunt in culpa qui officia deserunt
        mollit anim id est laborum"
    >
      Show modal 2
    </button>
    <button
      type="button"
      class="show-modal"
      aria-haspopup="dialog"
      aria-controls="modal-window"
      data-text="This is paragraph for Modal 3
    Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod
        tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim
        veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea
        commodo consequat. Duis aute irure dolor in reprehenderit in voluptate
        velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint
        occaecat cupidatat non proident, sunt in culpa qui officia deserunt
        mollit anim id est laborum.
    "
    >
      Show modal 3
    </button>

    <div
      id="modal-window"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="modal-title"
    >
      <button type="button" class="close-modal" aria-label="Close modal">&times;</button>
      <h1 id="modal-title">I'm a modal window 😍</h1>
      <p class="modal-text"></p>
    </div>

    <div class="overlay hidden"></div>
    <script src="script.js"></script>
  </body>
</html>
